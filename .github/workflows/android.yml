name: Android CI

# One run per change: pushes to main, and pull requests for everything else. Running both
# for every commit doubled the downloads and got the build rate-limited by Maven Central.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          # Let pull request builds save the dependency cache too, so they stop re-downloading.
          cache-read-only: false

      - name: Unit tests
        run: ./gradlew testDebugUnitTest

      - name: Build debug APK
        run: ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: mr-python-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      # Build artifacts expire and need a GitHub login. The latest test APK is therefore also
      # kept as a release asset, which has one stable address that never expires.
      - name: Publish the test APK under a permanent link
        if: github.ref == 'refs/heads/main' || github.event.pull_request.head.repo.full_name == github.repository
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk mr-python.apk
          if ! gh release view apk-latest >/dev/null 2>&1; then
            gh release create apk-latest --prerelease --target "$TARGET_SHA" \
              --title "Mr. Python – wersja testowa (APK)" \
              --notes "Najnowsza wersja testowa aplikacji, podmieniana automatycznie po każdej kompilacji. Zakupy są w niej symulowane, a reklamy próbne."
          fi
          # Two builds finishing at the same moment (a pull request and the merge
          # that follows it) can collide while replacing the file, so try again.
          for attempt in 1 2 3 4; do
            if gh release upload apk-latest mr-python.apk --clobber; then exit 0; fi
            sleep $((attempt * 10))
          done
          exit 1

      # The Google Play bundle. It is signed only when the upload key is stored in the
      # repository secrets (see docs/play-store/CHECKLIST.md); otherwise it is built
      # unsigned, which still proves that the release build works.
      - name: Build release bundle
        env:
          KEYSTORE_BASE64: ${{ secrets.MRPYTHON_KEYSTORE_BASE64 }}
          MRPYTHON_KEYSTORE_PASSWORD: ${{ secrets.MRPYTHON_KEYSTORE_PASSWORD }}
          MRPYTHON_KEY_ALIAS: ${{ secrets.MRPYTHON_KEY_ALIAS }}
          MRPYTHON_KEY_PASSWORD: ${{ secrets.MRPYTHON_KEY_PASSWORD }}
          MRPYTHON_ADMOB_APP_ID: ${{ secrets.MRPYTHON_ADMOB_APP_ID }}
          MRPYTHON_ADMOB_INTERSTITIAL_ID: ${{ secrets.MRPYTHON_ADMOB_INTERSTITIAL_ID }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"
            export MRPYTHON_KEYSTORE_FILE="$RUNNER_TEMP/upload.jks"
          fi
          ./gradlew bundleRelease

      - uses: actions/upload-artifact@v4
        with:
          name: mr-python-release-bundle
          path: app/build/outputs/bundle/release/app-release.aab
